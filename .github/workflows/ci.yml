name: verify

on:
  push:
  pull_request:

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile verifier
        run: python -m py_compile verify_catalog.py
      - name: Validate fixture
        run: python verify_catalog.py tests/fixture-catalog.json
